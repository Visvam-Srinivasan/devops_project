; inventory.ini
; The ingestion-worker container stands in for a real target VM. It is
; reached over SSH on the docker-compose network (hostname "ingestion-worker",
; port 22 — NOT the host-mapped 2222, since this inventory is used from
; inside the jenkins container, which shares the same docker network).

[ingestion_workers]
ingestion-worker ansible_host=ingestion-worker ansible_port=22 ansible_user=deploy ansible_python_interpreter=/usr/bin/python3

[ingestion_workers:vars]
ansible_ssh_private_key_file=/var/jenkins_home/.ssh/id_ed25519
ansible_ssh_common_args='-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'
